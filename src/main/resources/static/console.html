<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193f31">
  <title>HList | Console</title>
  <style>
    :root { color-scheme: light; --paper: #f1f2ec; --surface: #fbfcf7; --ink: #202a24; --muted: #647168; --line: #cbd2c8; --green: #245941; --green-dark: #193f31; --lime: #d8e66a; --coral: #c95037; --display: "Palatino Linotype", Georgia, serif; --body: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); background-image: linear-gradient(rgba(32, 42, 36, .035) 1px, transparent 1px); background-size: 100% 28px; font: 14px var(--body); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 0 5vw; color: #f8f8ef; background: var(--green-dark); border-bottom: 4px solid var(--lime); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; color: var(--green-dark); background: var(--lime); border-radius: 50%; font: 700 16px var(--display); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-user { color: #c2d0c6; font-size: 11px; }
    .header-actions .button.secondary { color: #f8f8ef; border-color: #607a6e; }

    .page { width: min(1100px, 92vw); margin: 0 auto; padding-bottom: 48px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 40px 0 24px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 0; font: 500 clamp(32px, 5vw, 48px) var(--display); }
    h1 span { color: var(--green); font-style: italic; }
    .hint { color: var(--muted); font-size: 12px; }
    .intro .hint { max-width: 360px; margin: 0; text-align: right; }

    .tabs { display: flex; gap: 4px; margin: 24px 0 18px; border-bottom: 1px solid var(--line); }
    .tab { padding: 10px 16px; color: var(--muted); background: transparent; border: 0; border-bottom: 3px solid transparent; font-weight: 700; }
    .tab[aria-selected="true"] { color: var(--green-dark); border-bottom-color: var(--green); }
    .tab-count { margin-left: 6px; color: var(--muted); font-size: 11px; font-weight: 600; }

    input, select { width: 100%; min-width: 0; min-height: 38px; padding: 8px 10px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; outline: none; }
    input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(36, 89, 65, .13); }
    label { color: var(--muted); font-size: 11px; font-weight: 700; }
    label span { display: block; margin-bottom: 5px; }

    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; color: #fff; background: var(--green); border: 1px solid var(--green); border-radius: 3px; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .button:hover:not(:disabled) { background: var(--green-dark); }
    .button.secondary { color: var(--green-dark); background: transparent; border-color: var(--line); }
    .button.secondary:hover:not(:disabled) { background: #e6ebe2; }
    .button.danger { color: var(--coral); background: transparent; border-color: #d8a89d; }
    .button.danger:hover:not(:disabled) { background: #f7e8e3; }
    .button.small { min-height: 30px; padding: 0 9px; font-size: 11px; }

    .add-form { display: grid; align-items: end; gap: 10px; margin-bottom: 18px; }
    .add-form.items { grid-template-columns: minmax(160px, 2fr) 80px minmax(130px, 1.2fr) minmax(130px, 1.2fr) minmax(140px, 1.5fr) auto; }
    .add-form.catalog { grid-template-columns: minmax(200px, 420px) auto; }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .table-tools input { max-width: 280px; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { padding: 8px 7px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 600; text-align: left; text-transform: uppercase; }
    .data-table td { padding: 9px 7px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .data-table td.actions { width: 1%; text-align: right; white-space: nowrap; }
    .data-table td.actions .button + .button { margin-left: 6px; }
    .data-table tr.editing td { padding: 6px 7px; background: rgba(216, 230, 106, .18); }
    .data-table .quantity { width: 70px; }
    .data-table td.timestamp { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .name { font-weight: 650; }
    .muted { color: var(--muted); }
    .empty { padding: 24px; color: var(--muted); background: rgba(255, 255, 255, .45); border: 1px dashed var(--line); text-align: center; }

    .toast { position: fixed; right: 22px; bottom: 20px; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; color: #fff; background: var(--green-dark); border-left: 4px solid var(--lime); }
    .toast.error { border-color: #ff8e70; }

    @media (max-width: 860px) {
      .add-form.items { grid-template-columns: 1fr 1fr; }
      .intro { flex-direction: column; align-items: start; }
      .intro .hint { text-align: left; }
      .header-user { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">H</span><span>HLIST</span></div>
    <div class="header-actions"><span id="header-user" class="header-user"></span><a class="button secondary small" href="shopping-lists.html">Lists</a><button id="logout" class="button danger small" type="button">Log out</button></div>
  </header>

  <main class="page">
    <section class="intro">
      <div><p class="eyebrow">Catalog / all your data</p><h1>Data <span>console</span></h1></div>
      <p class="hint">Items are yours. Departments and brands are shared by everyone using this HList server, so renaming one changes it for all.</p>
    </section>

    <nav class="tabs" role="tablist" aria-label="Data type">
      <button class="tab" type="button" role="tab" data-tab="items" aria-controls="panel-items">Items<span id="count-items" class="tab-count"></span></button>
      <button class="tab" type="button" role="tab" data-tab="departments" aria-controls="panel-departments">Departments<span id="count-departments" class="tab-count"></span></button>
      <button class="tab" type="button" role="tab" data-tab="brands" aria-controls="panel-brands">Brands<span id="count-brands" class="tab-count"></span></button>
    </nav>

    <section id="panel-items" class="panel" role="tabpanel">
      <form id="item-form" class="add-form items">
        <label><span>New item</span><input id="new-item-name" maxlength="255" placeholder="Item name" required></label>
        <label><span>Quantity</span><input id="new-item-quantity" type="number" min="1" step="1" value="1" required></label>
        <label><span>Department</span><select id="new-item-department"></select></label>
        <label><span>Brand</span><select id="new-item-brand"></select></label>
        <label><span>Comment</span><input id="new-item-comment" maxlength="1000" placeholder="Optional"></label>
        <button class="button" type="submit">Add item</button>
      </form>
      <div class="table-tools"><input id="item-filter" type="search" placeholder="Filter items" title="Matches name, department, brand or comment" aria-label="Filter items"><span id="item-summary" class="hint"></span></div>
      <table class="data-table">
        <thead><tr><th>Item</th><th>Quantity</th><th>Department</th><th>Brand</th><th>Comment</th><th>Updated</th><th></th></tr></thead>
        <tbody id="item-rows" data-type="item"></tbody>
      </table>
    </section>

    <section id="panel-departments" class="panel" role="tabpanel" hidden>
      <form id="department-form" class="add-form catalog" data-type="department">
        <label><span>New department</span><input maxlength="255" placeholder="e.g. Dairy" required></label>
        <button class="button" type="submit">Add department</button>
      </form>
      <table class="data-table">
        <thead><tr><th>Department</th><th>Your items</th><th></th></tr></thead>
        <tbody id="department-rows" data-type="department"></tbody>
      </table>
    </section>

    <section id="panel-brands" class="panel" role="tabpanel" hidden>
      <form id="brand-form" class="add-form catalog" data-type="brand">
        <label><span>New brand</span><input maxlength="255" placeholder="e.g. Kirkland" required></label>
        <button class="button" type="submit">Add brand</button>
      </form>
      <table class="data-table">
        <thead><tr><th>Brand</th><th>Your items</th><th></th></tr></thead>
        <tbody id="brand-rows" data-type="brand"></tbody>
      </table>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="api.js"></script>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const api = (path, options = {}) => hlist.api(path, options);
      const tabs = ["items", "departments", "brands"];
      const state = { items: [], departments: new Map(), brands: new Map(), editing: null, filter: "" };
      let toastTimer;

      function notify(message, isError = false) {
        const toast = byId("toast");
        toast.textContent = message;
        toast.classList.toggle("error", isError);
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 4200);
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
      }

      const byName = (first, second) => first.localeCompare(second, undefined, { sensitivity: "base" });
      const catalog = (type) => (type === "brand" ? state.brands : state.departments);
      const sortedCatalog = (type) => [...catalog(type)].sort(([, first], [, second]) => byName(first, second));

      function optionsHtml(type, selectedId) {
        return `<option value="">None</option>` + sortedCatalog(type)
          .map(([id, name]) => `<option value="${id}" ${id === selectedId ? "selected" : ""}>${escapeHtml(name)}</option>`).join("");
      }

      function showTab(tab) {
        const active = tabs.includes(tab) ? tab : "items";
        for (const name of tabs) {
          byId(`panel-${name}`).hidden = name !== active;
          document.querySelector(`[data-tab="${name}"]`).setAttribute("aria-selected", String(name === active));
        }
        if (window.location.hash !== `#${active}`) history.replaceState(null, "", `#${active}`);
      }

      function render() {
        byId("count-items").textContent = state.items.length;
        byId("count-departments").textContent = state.departments.size;
        byId("count-brands").textContent = state.brands.size;
        byId("new-item-department").innerHTML = optionsHtml("department", Number(byId("new-item-department").value) || null);
        byId("new-item-brand").innerHTML = optionsHtml("brand", Number(byId("new-item-brand").value) || null);
        renderItems();
        renderCatalog("department");
        renderCatalog("brand");
      }

      function isEditing(type, id) {
        return state.editing?.type === type && state.editing.id === id;
      }

      function actionButtons(type, id, editing) {
        return editing
          ? `<button class="button small" type="button" data-action="save" data-id="${id}">Save</button><button class="button secondary small" type="button" data-action="cancel">Cancel</button>`
          : `<button class="button secondary small" type="button" data-action="edit" data-id="${id}">Edit</button><button class="button danger small" type="button" data-action="delete" data-id="${id}">Delete</button>`;
      }

      // Read-only timestamp set by the server; the full date and time zone show as a tooltip.
      function timestampCell(value) {
        const shown = hlist.formatDateTime(value);
        return shown ? `<time datetime="${escapeHtml(value)}" title="${escapeHtml(new Date(value).toString())}">${escapeHtml(shown)}</time>` : "—";
      }

      function renderItems() {
        const query = state.filter.trim().toLowerCase();
        const describe = (item) => [item.itemName, state.departments.get(item.departmentId), state.brands.get(item.brandId), item.itemComment]
          .filter(Boolean).join(" ").toLowerCase();
        const items = state.items
          .filter((item) => !query || describe(item).includes(query))
          .sort((first, second) => byName(first.itemName, second.itemName));
        byId("item-summary").textContent = query ? `${items.length} of ${state.items.length} items` : "";
        if (!items.length) {
          byId("item-rows").innerHTML = `<tr><td colspan="7"><div class="empty">${state.items.length ? "No items match the filter." : "No items yet. Items you add here or on a shopping list appear in this table."}</div></td></tr>`;
          return;
        }
        byId("item-rows").innerHTML = items.map((item) => isEditing("item", item.itemId) ? `
          <tr class="editing" data-id="${item.itemId}">
            <td><input data-field="name" maxlength="255" value="${escapeHtml(item.itemName)}" aria-label="Item name"></td>
            <td><input class="quantity" data-field="quantity" type="number" min="1" step="1" value="${item.quantity ?? 1}" aria-label="Quantity"></td>
            <td><select data-field="departmentId" aria-label="Department">${optionsHtml("department", item.departmentId)}</select></td>
            <td><select data-field="brandId" aria-label="Brand">${optionsHtml("brand", item.brandId)}</select></td>
            <td><input data-field="comment" maxlength="1000" value="${escapeHtml(item.itemComment)}" aria-label="Comment"></td>
            <td class="timestamp">${timestampCell(item.updatedAt)}</td>
            <td class="actions">${actionButtons("item", item.itemId, true)}</td>
          </tr>` : `
          <tr data-id="${item.itemId}">
            <td class="name">${escapeHtml(item.itemName)}</td>
            <td>${item.quantity ?? 1}</td>
            <td>${escapeHtml(state.departments.get(item.departmentId) ?? "—")}</td>
            <td>${escapeHtml(state.brands.get(item.brandId) ?? "—")}</td>
            <td class="muted">${escapeHtml(item.itemComment ?? "")}</td>
            <td class="timestamp">${timestampCell(item.updatedAt)}</td>
            <td class="actions">${actionButtons("item", item.itemId, false)}</td>
          </tr>`).join("");
      }

      function renderCatalog(type) {
        const host = byId(`${type}-rows`);
        const entries = sortedCatalog(type);
        const usage = (id) => state.items.filter((item) => (type === "brand" ? item.brandId : item.departmentId) === id).length;
        if (!entries.length) {
          host.innerHTML = `<tr><td colspan="3"><div class="empty">No ${type}s yet.</div></td></tr>`;
          return;
        }
        host.innerHTML = entries.map(([id, name]) => isEditing(type, id) ? `
          <tr class="editing" data-id="${id}">
            <td><input data-field="name" maxlength="255" value="${escapeHtml(name)}" aria-label="${type} name"></td>
            <td class="muted">${usage(id)}</td>
            <td class="actions">${actionButtons(type, id, true)}</td>
          </tr>` : `
          <tr data-id="${id}">
            <td class="name">${escapeHtml(name)}</td>
            <td class="muted">${usage(id)}</td>
            <td class="actions">${actionButtons(type, id, false)}</td>
          </tr>`).join("");
      }

      async function load() {
        const [items, departments, brands] = await Promise.all([api("/api/items"), api("/api/departments"), api("/api/brands")]);
        state.items = items;
        state.departments = new Map(departments.map((department) => [department.departmentId, department.departmentName]));
        state.brands = new Map(brands.map((brand) => [brand.brandId, brand.brandName]));
        render();
      }

      function startEditing(type, id) {
        state.editing = { type, id };
        render();
        document.querySelector(`#${type}-rows tr.editing [data-field="name"]`)?.focus();
      }

      function stopEditing() {
        state.editing = null;
        render();
        if (reloadPending) reloadFromServer();
      }

      // Changes made on other devices. A reload while a row is being edited would wipe the typing,
      // so it waits until the edit is saved or cancelled.
      let reloadPending = false;
      const reloadFromServer = hlist.debounced(async () => {
        if (state.editing) {
          reloadPending = true;
          return;
        }
        reloadPending = false;
        await load();
      });

      function itemBody(read) {
        const departmentId = read("departmentId");
        const brandId = read("brandId");
        return {
          name: read("name").trim(),
          quantity: Math.max(1, Number(read("quantity")) || 1),
          departmentId: departmentId ? Number(departmentId) : null,
          brandId: brandId ? Number(brandId) : null,
          comment: read("comment").trim() || null
        };
      }

      async function save(type, id, row) {
        const read = (field) => row.querySelector(`[data-field="${field}"]`)?.value ?? "";
        try {
          if (type === "item") {
            const body = itemBody(read);
            if (!body.name) throw new Error("Enter an item name.");
            const saved = await api(`/api/items/${id}`, { method: "PUT", body });
            state.items = state.items.map((item) => (item.itemId === id ? saved : item));
          } else {
            const name = read("name").trim();
            if (!name) throw new Error(`Enter a ${type} name.`);
            const saved = await api(`/api/${type}s/${id}`, { method: "PUT", body: { name } });
            catalog(type).set(id, type === "brand" ? saved.brandName : saved.departmentName);
          }
          stopEditing();
          notify("Saved");
        } catch (error) { notify(error.message, true); }
      }

      async function remove(type, id) {
        const name = type === "item" ? state.items.find((item) => item.itemId === id)?.itemName : catalog(type).get(id);
        const warning = type === "item"
          ? `Delete the item "${name}"? It is also removed from any shopping lists it is on.`
          : `Delete the ${type} "${name}"? This affects everyone using this HList server.`;
        if (!window.confirm(warning)) return;
        try {
          await api(type === "item" ? `/api/items/${id}` : `/api/${type}s/${id}`, { method: "DELETE" });
          if (type === "item") state.items = state.items.filter((item) => item.itemId !== id);
          else catalog(type).delete(id);
          if (isEditing(type, id)) state.editing = null;
          render();
          notify(`Deleted ${name}`);
        } catch (error) { notify(error.message, true); }
      }

      for (const host of ["item-rows", "department-rows", "brand-rows"].map(byId)) {
        const type = host.dataset.type;
        host.addEventListener("click", (event) => {
          const button = event.target.closest("[data-action]");
          if (!button) return;
          const id = Number(button.dataset.id);
          if (button.dataset.action === "edit") startEditing(type, id);
          else if (button.dataset.action === "cancel") stopEditing();
          else if (button.dataset.action === "save") save(type, id, button.closest("tr"));
          else if (button.dataset.action === "delete") remove(type, id);
        });
        host.addEventListener("keydown", (event) => {
          const row = event.target.closest("tr.editing");
          if (!row) return;
          if (event.key === "Enter") { event.preventDefault(); save(type, Number(row.dataset.id), row); }
          if (event.key === "Escape") stopEditing();
        });
      }

      byId("item-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = itemBody((field) => ({
          name: byId("new-item-name"), quantity: byId("new-item-quantity"), departmentId: byId("new-item-department"),
          brandId: byId("new-item-brand"), comment: byId("new-item-comment")
        })[field].value);
        try {
          const item = await api("/api/items", { method: "POST", body });
          state.items.push(item);
          byId("item-form").reset();
          render();
          byId("new-item-name").focus();
          notify(`Added ${item.itemName}`);
        } catch (error) { notify(error.message, true); }
      });

      for (const form of [byId("department-form"), byId("brand-form")]) {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const type = form.dataset.type;
          const input = form.querySelector("input");
          try {
            const created = await api(`/api/${type}s`, { method: "POST", body: { name: input.value.trim() } });
            const id = type === "brand" ? created.brandId : created.departmentId;
            catalog(type).set(id, type === "brand" ? created.brandName : created.departmentName);
            form.reset();
            render();
            input.focus();
            notify(`Added ${catalog(type).get(id)}`);
          } catch (error) { notify(error.message, true); }
        });
      }

      byId("item-filter").addEventListener("input", (event) => { state.filter = event.target.value; renderItems(); });
      document.querySelector(".tabs").addEventListener("click", (event) => {
        const tab = event.target.closest("[data-tab]");
        if (tab) showTab(tab.dataset.tab);
      });
      byId("logout").addEventListener("click", () => hlist.logout());

      showTab(window.location.hash.slice(1));
      hlist.live((event) => {
        if (["items", "catalog", "resume"].includes(event.type)) reloadFromServer();
      });

      hlist.currentUser().then((user) => {
        if (!user) { window.location.replace("login.html"); return; }
        byId("header-user").textContent = user.username;
        return load();
      }).catch((error) => notify(error.message, true));
    })();
  </script>
</body>
</html>
