<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#193f31"><title>HList | Shopping Lists</title><style>.header-actions .button.secondary { color: #f8f8ef; border-color: #607a6e; }.pane-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}.pane-heading h2{margin:0;font-size:20px}.completed-pane{margin-top:28px;border-top:1px solid var(--line)}.completed-pane summary{padding:16px 0;color:var(--green);font-family:var(--display);font-size:20px;cursor:pointer;list-style-position:inside}.completed-pane summary::marker{color:var(--green)}.completed-pane .list-items{padding-bottom:12px}</style>
  <style>
    :root { color-scheme:light; --paper:#f1f2ec; --surface:#fbfcf7; --ink:#202a24; --muted:#647168; --line:#cbd2c8; --green:#245941; --green-dark:#193f31; --lime:#d8e66a; --coral:#c95037; --display:"Palatino Linotype",Georgia,serif; --body:"Avenir Next",Avenir,"Segoe UI",sans-serif; }
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);background-image:linear-gradient(rgba(32,42,36,.035) 1px,transparent 1px);background-size:100% 28px;font:14px var(--body)} button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.45}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 5vw;color:#f8f8ef;background:var(--green-dark);border-bottom:4px solid var(--lime)}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.04em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;color:var(--green-dark);background:var(--lime);border-radius:50%;font:700 16px var(--display)}.header-actions{display:flex;align-items:center;gap:8px}.header-user{color:#c2d0c6;font-size:11px}.page{width:min(860px,92vw);margin:0 auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:40px 0 24px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 8px;color:var(--green);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}h1,h2,p{margin-top:0}h1{margin-bottom:0;font:500 clamp(32px,5vw,48px) var(--display)}h1 span{color:var(--green);font-style:italic}h2{font:500 24px var(--display)}.api{color:var(--muted);font-size:12px}.list-toolbar{display:flex;align-items:end;gap:10px;margin:24px 0}.list-toolbar label{flex:1;color:var(--muted);font-size:11px;font-weight:700}.list-toolbar label span{display:block;margin-bottom:5px}.list-toolbar input,input{min-height:38px;padding:8px 10px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;outline:0}.list-toolbar input:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(36,89,65,.13)}.button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;color:#fff;background:var(--green);border:1px solid var(--green);border-radius:3px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.button:hover:not(:disabled){background:var(--green-dark)}.button.secondary{color:var(--green-dark);background:transparent;border-color:var(--line)}.button.danger{color:var(--coral);background:transparent;border-color:#d8a89d}.button.small{min-height:30px;padding:0 9px;font-size:11px}.list-tools{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.hint{color:var(--muted);font-size:12px}.pager{display:flex;align-items:center;gap:6px}.list-items{display:grid;gap:4px;margin:0;padding:0;list-style:none}.list-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.list-check{width:17px;height:17px;margin-left:4px;accent-color:var(--green)}.list-row-completed .list-title{color:var(--muted);text-decoration:line-through}.list-date{margin-left:6px;color:var(--muted);font-size:12px;font-weight:500}.store-icon{display:inline-block;width:20px;height:20px;margin-right:8px;vertical-align:-5px;border-radius:5px;object-fit:contain}.store-icon.loaded{background:#fff;box-shadow:0 0 0 1px var(--line)}.list-row-completed .store-icon{opacity:.5}.store-icon-empty{display:inline-block;background:none;box-shadow:none}.list-row-completed .list-date{text-decoration:none}.list-title{overflow:hidden;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.list-id{color:var(--muted);font-size:10px}.list-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:8px 10px;color:var(--ink);background:transparent;border:1px solid transparent;text-align:left}.list-entry:hover{background:rgba(255,255,255,.55)}.empty{padding:24px;color:var(--muted);background:rgba(255,255,255,.45);border:1px dashed var(--line);text-align:center}.dialog{width:min(420px,90vw);padding:24px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lime);box-shadow:0 12px 32px rgba(20,34,26,.2)}.dialog::backdrop{background:rgba(25,63,49,.3)}.dialog h2{margin:0 0 18px}.dialog label{display:block;margin-bottom:12px;color:var(--muted);font-size:11px;font-weight:700}.dialog label span{display:block;margin-bottom:5px}.dialog-actions{display:flex;justify-content:end;gap:8px;margin-top:18px}.toast{position:fixed;right:22px;bottom:20px;max-width:min(440px,calc(100vw - 32px));padding:12px 16px;color:#fff;background:var(--green-dark);border-left:4px solid var(--lime)}.toast.error{border-color:#ff8e70}@media(max-width:600px){.intro,.list-toolbar{align-items:start;flex-direction:column}.header-user{display:none}.list-toolbar .button{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">H</span><span>HLIST</span></div><div class="header-actions"><span id="header-user" class="header-user"></span><a class="button secondary small" href="/app/add" title="Set up the Add to HList bookmark">Add from websites</a><a class="button secondary small" href="console.html">Console</a><button id="add-passkey" class="button secondary small" type="button" title="Sign in with Touch ID instead of your password" hidden>Add passkey</button><button id="change-password-open" class="button secondary small" type="button">Change password</button><button id="logout" class="button danger small" type="button">Log out</button></div></header>
  <main class="page"><section class="intro"><div><p class="eyebrow">Your workspace / step 2</p><h1>Shopping <span>lists</span></h1></div><span id="api-status" class="api">Loading...</span></section>
    <form id="list-form" class="list-toolbar"><label><span>New shopping list</span><input id="list-name" maxlength="255" placeholder="e.g. Weekend shop" required></label><button class="button" type="submit">Add list</button></form>
    <div class="list-tools"><span id="list-summary" class="hint"></span><div class="pager"><button id="previous-page" class="button secondary small" type="button">Prev</button><span id="page-count" class="hint">0 / 0</span><button id="next-page" class="button secondary small" type="button">Next</button></div></div>
    <div id="shopping-lists">
      <section><div class="pane-heading"><h2>Active lists</h2><span id="active-count" class="hint"></span></div><ul id="active-lists" class="list-items"><li class="empty">Loading lists...</li></ul></section>
      <details id="completed-pane" class="completed-pane"><summary>Completed lists <span id="completed-count" class="hint"></span></summary><ul id="completed-lists" class="list-items"></ul></details>
    </div>
  </main>
  <dialog id="password-dialog" class="dialog"><form id="password-form"><h2>Change password</h2><label><span>Current password</span><input id="current-password" type="password" required></label><label><span>New password</span><input id="new-password" type="password" required></label><div class="dialog-actions"><button id="password-cancel" class="button secondary" type="button">Cancel</button><button class="button" type="submit">Update password</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="api.js"></script>
  <script>
    (() => {
      const session = JSON.parse(sessionStorage.getItem("hlist-session") || "null");
      const state = { selectedList: session?.selectedList || null, page:0, size:20, lists:[] }; const byId = (id) => document.getElementById(id); const api = hlist.api; let toastTimer;
      function notify(message,error=false){const toast=byId("toast");toast.textContent=message;toast.classList.toggle("error",error);toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,4200)}
      function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,(character)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character])}
      function saveSession(){sessionStorage.setItem("hlist-session",JSON.stringify({selectedList:state.selectedList||null}))}
      function renderListGroup(hostId, lists, emptyMessage){const host=byId(hostId);if(!lists.length){host.innerHTML=`<li class="empty">${emptyMessage}</li>`;return}host.innerHTML=lists.map((list)=>`<li class="list-row ${list.completed?"list-row-completed":""}"><input class="list-check" type="checkbox" data-toggle-list="${list.shoppingListId}" aria-label="Mark ${escapeHtml(list.shoppingListName)} as done" ${list.completed?"checked":""}><button class="list-entry" type="button" data-list-id="${list.shoppingListId}"><span class="list-title">${hlist.storeIcon(list.store,{keepSpace:true})}${escapeHtml(list.shoppingListName)} <span class="list-date">${hlist.formatDate(list.createdAt)}</span></span><span class="list-id">#${list.shoppingListId}</span></button></li>`).join("")}
      function renderLists(){const activeLists=state.lists.filter((list)=>!list.completed);const completedLists=state.lists.filter((list)=>list.completed);renderListGroup("active-lists",activeLists,"No active shopping lists.");renderListGroup("completed-lists",completedLists,"No completed shopping lists.");byId("active-count").textContent=activeLists.length;byId("completed-count").textContent=completedLists.length}
      async function loadLists(){const result=await api(`/api/shopping-lists?page=${state.page}&size=${state.size}`);state.lists=result.content;renderLists();byId("list-summary").textContent=`${result.totalElements} list${result.totalElements===1?"":"s"}`;byId("page-count").textContent=result.totalPages?`${result.page+1} / ${result.totalPages}`:"0 / 0";byId("previous-page").disabled=result.first;byId("next-page").disabled=result.last}
      byId("list-form").addEventListener("submit",async(event)=>{event.preventDefault();try{const list=await api("/api/shopping-lists",{method:"POST",body:{name:byId("list-name").value.trim()}});byId("list-form").reset();state.selectedList=list;saveSession();await loadLists();notify("Shopping list created")}catch(error){notify(error.message,true)}});
      byId("shopping-lists").addEventListener("click",async(event)=>{const toggle=event.target.closest("[data-toggle-list]");if(toggle){try{await api(`/api/shopping-lists/${toggle.dataset.toggleList}/completion`,{method:"PATCH",body:{completed:toggle.checked}});await loadLists()}catch(error){toggle.checked=!toggle.checked;notify(error.message,true)}return}const button=event.target.closest("[data-list-id]");if(!button)return;const list=state.lists.find((candidate)=>candidate.shoppingListId===Number(button.dataset.listId));state.selectedList=list;saveSession();window.location.href="shopping-list-items.html"});
      byId("previous-page").addEventListener("click",async()=>{state.page=Math.max(0,state.page-1);try{await loadLists()}catch(error){notify(error.message,true)}});byId("next-page").addEventListener("click",async()=>{state.page++;try{await loadLists()}catch(error){state.page--;notify(error.message,true)}});
      hlist.passkeys.available().then((available)=>{byId("add-passkey").hidden=!available});byId("add-passkey").addEventListener("click",async()=>{try{await hlist.passkeys.add();notify("Passkey saved. Next time, sign in with Touch ID.")}catch(error){if(!hlist.passkeys.cancelled(error))notify(error.message,true)}});
      byId("logout").addEventListener("click",()=>hlist.logout());byId("change-password-open").addEventListener("click",()=>byId("password-dialog").showModal());byId("password-cancel").addEventListener("click",()=>{byId("password-form").reset();byId("password-dialog").close()});
      byId("password-form").addEventListener("submit",async(event)=>{event.preventDefault();try{await api("/api/users/me/password",{method:"PUT",body:{currentPassword:byId("current-password").value,newPassword:byId("new-password").value}});byId("password-dialog").close();byId("password-form").reset();notify("Password updated")}catch(error){notify(error.message,true)}});
      hlist.currentUser().then((user)=>{if(!user){window.location.replace("login.html");return}byId("header-user").textContent=user.username;byId("api-status").textContent="Authenticated"}).catch(error=>notify(error.message,true));let listPageLoaded=false;window.addEventListener("pageshow",()=>{if(listPageLoaded)loadLists().catch(error=>notify(error.message,true))});const reloadLists=hlist.debounced(loadLists);hlist.live((event)=>{if(event.type==="lists"||event.type==="resume")reloadLists()});loadLists().then(()=>{listPageLoaded=true}).catch(error=>notify(error.message,true));
    })();
  </script>
</body>
</html>
