<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193f31">
  <title>HList | Sign in</title>
  <!-- Phones and tablets that land here (bookmarks, autocomplete) go to the mobile app unless desktop was chosen. -->
  <script src="ui-choice.js"></script>
  <script>if (hlistUi.choose() === "mobile") window.location.replace("/app/");</script>
  <style>
    :root { color-scheme: light; --paper:#f1f2ec; --surface:#fbfcf7; --ink:#202a24; --muted:#647168; --line:#cbd2c8; --green:#245941; --green-dark:#193f31; --lime:#d8e66a; --coral:#c95037; --display:"Palatino Linotype", Georgia, serif; --body:"Avenir Next", Avenir, "Segoe UI", sans-serif; }
    * { box-sizing:border-box; } [hidden] { display:none !important; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); background-image:linear-gradient(rgba(32,42,36,.035) 1px,transparent 1px); background-size:100% 28px; font-family:var(--body); font-size:14px; }
    button,input { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.45; } .topbar { min-height:62px; padding:0 5vw; display:flex; align-items:center; color:#f8f8ef; background:var(--green-dark); border-bottom:4px solid var(--lime); } .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:.04em; } .brand-mark { display:grid; place-items:center; width:30px; height:30px; color:var(--green-dark); background:var(--lime); border-radius:50%; font-family:var(--display); font-weight:700; }
    .page { width:min(720px,92vw); margin:0 auto; } .intro { padding:58px 0 24px; border-bottom:1px solid var(--line); } .eyebrow { margin:0 0 8px; color:var(--green); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; } h1,h2,p { margin-top:0; } h1 { margin-bottom:0; font-family:var(--display); font-size:clamp(34px,6vw,52px); font-weight:500; } h1 span { color:var(--green); font-style:italic; } .access { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:28px 0; } .access-block + .access-block { padding-left:28px; border-left:1px solid var(--line); } h2 { margin-bottom:16px; font-family:var(--display); font-size:24px; font-weight:500; } label { display:block; margin-bottom:12px; color:var(--muted); font-size:11px; font-weight:700; } label span { display:block; margin-bottom:5px; } input { display:block; width:100%; min-height:40px; padding:8px 10px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:3px; outline:0; } input:focus { border-color:var(--green); box-shadow:0 0 0 2px rgba(36,89,65,.13); } .button { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:0 14px; color:#fff; background:var(--green); border:1px solid var(--green); border-radius:3px; font-size:12px; font-weight:700; } .button:hover:not(:disabled) { background:var(--green-dark); } .button.secondary { color:var(--green-dark); background:transparent; border-color:var(--line); } .hint { color:var(--muted); font-size:12px; } .toast { position:fixed; right:22px; bottom:20px; max-width:min(440px,calc(100vw - 32px)); padding:12px 16px; color:#fff; background:var(--green-dark); border-left:4px solid var(--lime); } .toast.error { border-color:#ff8e70; }
    .sign-in-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .ui-switch { padding:0 0 32px; } .ui-switch a { color:var(--green); font-weight:700; }
    .remember { display:flex; align-items:center; gap:8px; margin:4px 0 16px; font-weight:600; } .remember input { width:17px; min-height:0; height:17px; margin:0; accent-color:var(--green); box-shadow:none; } .remember span { display:inline; margin:0; }
    @media (max-width:650px) { .access { grid-template-columns:1fr; } .access-block + .access-block { padding:24px 0 0; border-top:1px solid var(--line); border-left:0; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">H</span><span>HLIST</span></div></header>
  <main class="page">
    <section class="intro"><p class="eyebrow">Your shopping workspace</p><h1>Make shopping <span>lighter</span></h1></section>
    <section class="access" aria-label="Account access">
      <div class="access-block"><h2>Sign in</h2><form id="login-form"><label><span>Username</span><input id="login-username" autocomplete="username" maxlength="50" required></label><label><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label><label class="remember"><input id="login-remember" type="checkbox" checked><span>Keep me signed in for 30 days</span></label><div class="sign-in-actions"><button class="button" type="submit">Continue</button><button id="passkey-sign-in" class="button secondary" type="button" hidden>Sign in with passkey</button></div></form></div>
      <div class="access-block"><h2>Create account</h2><form id="register-form"><label><span>Username</span><input id="register-username" autocomplete="username" maxlength="50" required></label><label><span>Password</span><input id="register-password" type="password" autocomplete="new-password" required></label><label id="register-invite-field" hidden><span>Invite code</span><input id="register-invite" autocomplete="off" maxlength="200"></label><button class="button secondary" type="submit">Register</button></form></div>
    </section>
    <p class="hint ui-switch">On a phone or tablet? <a href="/?ui=mobile">Use the mobile app</a></p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="api.js"></script>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      let toastTimer;
      function notify(message, error = false) { const toast = byId("toast"); toast.textContent = message; toast.classList.toggle("error", error); toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 4200); }
      function enter() { sessionStorage.setItem("hlist-session", JSON.stringify({ selectedList: null })); window.location.href = "shopping-lists.html"; }
      byId("login-form").addEventListener("submit", async (event) => { event.preventDefault(); const username = byId("login-username").value.trim(); const password = byId("login-password").value; try { await hlist.login(username, password, byId("login-remember").checked); enter(); } catch (error) { notify(error.message, true); } });
      byId("register-form").addEventListener("submit", async (event) => { event.preventDefault(); const username = byId("register-username").value.trim(); const password = byId("register-password").value; const inviteCode = byId("register-invite-field").hidden ? undefined : byId("register-invite").value.trim(); try { await hlist.register(username, password, inviteCode); await hlist.login(username, password, true); enter(); } catch (error) { notify(error.message, true); } });
      // Passkeys: offered in the username field's AutoFill, and by the button where AutoFill doesn't show them.
      const remember = () => byId("login-remember").checked;
      async function startAutofill() {
        if (!await hlist.passkeys.autofillAvailable()) return;
        try { await hlist.passkeys.signIn(remember, true); enter(); } catch (error) { if (!hlist.passkeys.cancelled(error)) { notify(error.message, true); startAutofill(); } }
      }
      hlist.passkeys.available().then((available) => {
        if (!available) return;
        byId("login-username").autocomplete = "username webauthn";
        byId("passkey-sign-in").hidden = false;
        startAutofill();
      });
      byId("passkey-sign-in").addEventListener("click", async () => {
        hlist.passkeys.cancel();
        try { await hlist.passkeys.signIn(remember); enter(); } catch (error) { if (!hlist.passkeys.cancelled(error)) notify(error.message, true); startAutofill(); }
      });
      hlist.inviteRequired().then((required) => { byId("register-invite-field").hidden = !required; byId("register-invite").required = required; }).catch(() => {});
      hlist.currentUser().then((user) => { if (user) window.location.replace("shopping-lists.html"); }).catch(() => {});
    })();
  </script>
</body>
</html>
