name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image (server + mobile client)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The Dockerfile expects the mobile client next to the server, passed as the "client" build context.
      - uses: actions/checkout@v4
        with:
          path: server

      - uses: actions/checkout@v4
        with:
          repository: apbthere/hlist-client
          path: hlist-client

      - uses: docker/setup-buildx-action@v3

      - name: Build image for the NAS (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: server
          build-contexts: client=hlist-client
          build-args: |
            SERVER_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          platforms: linux/amd64
          tags: hlist:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
